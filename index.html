<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDC // SKILL DEVELOPMENT CLUB — OPERATIVE HUB [v2.6]</title>
    <meta name="description" content="Digital Hub, Management Portal, and Operational Matrix for the Skill Development Club. Acubi cyber-editorial aesthetic." />
    
    <!-- Google Fonts for Acubi Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;600;700;800;900&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

    <!-- SDC OAuth Popup Fast Callback Handler -->
    <script>
      (function() {
        try {
          if (window.opener && window.name === 'sdc_oauth_popup') {
            var hash = window.location.hash || '';
            var search = window.location.search || '';
            if (hash.includes('access_token') || search.includes('code=') || hash.includes('error')) {
              window.opener.postMessage({
                type: 'SDC_OAUTH_SUCCESS',
                hash: hash,
                search: search
              }, window.location.origin);
              document.title = 'Sign-in Complete';
              document.body.innerHTML = '<div style="background:#09090b;color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;font-size:13px;"><div style="font-weight:600;margin-bottom:4px;">Signed in successfully</div><div style="color:#a1a1aa;font-size:12px;">Closing window...</div></div>';
              setTimeout(function() {
                window.close();
              }, 250);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#08080a] text-zinc-100 antialiased selection:bg-zinc-200 selection:text-black overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
